<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Turn Time Analyzer</title>
        <link rel="stylesheet" href="stylo.css" />
        <script src="script.js" defer></script>
    </head>

    <body>
        <main class="app">
            <div class="container">
                <section class="textarea-container">
                    <textarea
                        name="turnTimes"
                        id="turn-times"
                        minlength="200"
                        maxlength="500"
                    ></textarea>
                    <div class="dp-time-container">
                        <label for="dp-time">Departure Time:</label>
                        <input type="text" id="dp-time" />
                    </div>
                </section>
                <section>
                    <button id="boton">Parse</button>
                </section>
            </div>

            <div class="progress-container">
                <div class="combined-bar" id="combined-bar"></div>
                <div class="labels-bar" id="labels-bar"></div>
            </div>
        </main>
    </body>
</html>
